name: iOS Build Verification

on:
  workflow_dispatch:  # Manual trigger from GitHub

jobs:
  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Display Environment Info
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"
          echo "Java: $(java -version 2>&1 | head -1)"

      - name: Build KMP Shared Framework
        run: |
          ./gradlew :shared:linkDebugFrameworkIosArm64 \
                    :shared:linkDebugFrameworkIosSimulatorArm64 \
                    --stacktrace
          echo "Framework built successfully"

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pod Dependencies
        working-directory: iosApp
        run: pod install --repo-update

      - name: Build iOS App (Debug, No Signing)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme "Ovasta Sellers" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          echo "iOS build succeeded"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: iosApp/build.log
          retention-days: 7
