name: iOS Build Verification

on:
  workflow_dispatch:  # Manual trigger from GitHub

jobs:
  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Display Environment Info
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"
          echo "Java: $(java -version 2>&1 | head -1)"

      # Step 1: Build KMP Shared Framework with Compose Multiplatform
      - name: Build KMP Shared Framework (Debug - Simulator)
        run: |
          echo "Building shared framework for iOS Simulator..."
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
          echo "Framework built successfully"
          ls -lh shared/build/bin/iosSimulatorArm64/debugFramework/

      - name: Build KMP Shared Framework (Debug - Device)
        run: |
          echo "Building shared framework for iOS Device..."
          ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace
          echo "Framework built successfully"

      # Step 2: Generate Xcode project with xcodegen
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: iosApp
        run: |
          echo "Generating Xcode project from project.yml..."
          xcodegen generate
          echo "Xcode project generated successfully"
          ls -la iosApp.xcodeproj/

      # Step 3: Build iOS app (no signing)
      - name: Build iOS App (Simulator - No Signing)
        working-directory: iosApp
        run: |
          echo "Building iOS app for Simulator..."
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS='$(inherited) $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework' \
            OTHER_LDFLAGS='$(inherited) -framework sharedKit' \
            | tee build.log | tail -50

          echo "iOS app built successfully!"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: iosApp/build.log
          retention-days: 7
