name: Deploy iOS to TestFlight (Manual)

on:
  workflow_dispatch:
    inputs:
      match_readonly:
        description: 'Match readonly mode (false for first run to generate certs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-testflight:
    name: Build & Deploy iOS to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: ${{ github.event.inputs.match_readonly || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      # ============================================
      # PHASE 1: ENVIRONMENT SETUP
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Cache Kotlin/Native Compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: iosApp/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('iosApp/Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # ============================================
      # PHASE 2: BUILD KMP FRAMEWORK
      # ============================================

      - name: Build KMP Shared Framework (Release)
        run: |
          echo "Building iOS framework..."
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace
          echo "Framework built successfully"

      # ============================================
      # PHASE 3: IOS PROJECT SETUP
      # ============================================

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iosApp
          xcodegen generate
          echo "Xcode project generated"

      - name: Install Ruby Dependencies (Fastlane + CocoaPods)
        run: |
          cd iosApp
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          bundle exec fastlane --version
          echo "Fastlane and CocoaPods installed"

      - name: Validate ASC key format
        run: |
          cd iosApp
          ruby -e 'require "base64"; raw = ENV.fetch("ASC_PRIVATE_KEY", "").strip; abort("ASC_PRIVATE_KEY is missing") if raw.empty?; pem = (raw.include?("BEGIN PRIVATE KEY") || raw.include?("BEGIN EC PRIVATE KEY")) ? raw : Base64.decode64(raw); pem = pem.gsub("\\n", "\n").gsub("\r\n", "\n").strip; abort("ASC key is not PEM") unless pem.include?("BEGIN") && pem.include?("END"); puts "ASC key payload looks valid"'

      - name: Install Pod Dependencies
        run: |
          cd iosApp
          bundle exec pod install --repo-update
          echo "Pods installed"

      # ============================================
      # PHASE 4: BUILD, SIGN & UPLOAD (Fastlane)
      # ============================================

      - name: Setup Keychain
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Debug Fastlane Detection
        run: |
          pwd
          find . -name Fastfile

      - name: Print Fastfile
        run: |
          cat iosApp/fastlane/Fastfile

      - name: Run Fastlane Beta (Match + Build + Upload)
        run: |
          cd iosApp
          pwd
          ls -la
          ls -la fastlane
          bundle exec fastlane beta
          echo "TestFlight deployment complete!"

      # ============================================
      # PHASE 5: ARTIFACTS & CLEANUP
      # ============================================

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ovasta-sellers-ios
          path: iosApp/build/*.ipa
          retention-days: 30

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Deployment Summary
        if: success()
        run: |
          echo "==================================="
          echo " TESTFLIGHT DEPLOYMENT SUCCESSFUL  "
          echo "==================================="
          echo ""
          echo "App: Ovasta Sellers"
          echo "Bundle ID: com.ovasta.sellers"
          echo "Team ID: H8X427WWQW"
          echo ""
          echo "Next Steps:"
          echo "  1. Go to appstoreconnect.apple.com"
          echo "  2. Wait for processing (15-30 min)"
          echo "  3. Add beta testers when ready"