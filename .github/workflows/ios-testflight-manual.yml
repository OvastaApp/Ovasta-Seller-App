name: Deploy iOS to TestFlight (Manual)

on:
  workflow_dispatch:
    inputs:
      match_readonly:
        description: 'Match readonly mode (false for first run to generate certs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-testflight:
    name: Build & Deploy iOS to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: ${{ github.event.inputs.match_readonly || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      # ============================================
      # PHASE 1: ENVIRONMENT SETUP
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install iOS Simulator Runtime
        run: |
          xcodebuild -downloadPlatform iOS || true
          xcrun simctl list runtimes

      - name: Cache Kotlin/Native Compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: iosApp/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('iosApp/Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew


      # ============================================
      # PHASE 2: BUILD KMP FRAMEWORK
      # ============================================

      - name: Build KMP Shared Framework (Release)
        run: |
          echo "Building iOS framework..."
          set -o pipefail
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          echo "Framework built successfully"
          echo "=== Last 50 lines of Gradle output ==="
          tail -50 /tmp/gradle-build.log

      - name: Verify Framework Exports
        run: |
          echo "=== Framework location ==="
          find shared/build -name "sharedKit.framework" -type d 2>/dev/null
          FRAMEWORK=$(find shared/build -path "*/Release/sharedKit.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            FRAMEWORK=$(find shared/build -name "sharedKit.framework" -type d | head -1)
          fi
          echo "Using framework: $FRAMEWORK"
          echo ""
          echo "=== Framework Headers ==="
          ls -la "$FRAMEWORK/Headers/" 2>/dev/null || echo "No Headers dir!"
          echo ""
          echo "=== Searching for initKoin in header ==="
          grep -i "koin" "$FRAMEWORK/Headers/sharedKit.h" 2>/dev/null || echo "initKoin NOT FOUND in header!"
          echo ""
          echo "=== Main_iosKt class in header ==="
          grep -A 5 "Main_iosKt" "$FRAMEWORK/Headers/sharedKit.h" 2>/dev/null || echo "Main_iosKt NOT FOUND in header!"
          echo ""
          echo "=== Full header (first 200 lines) ==="
          head -200 "$FRAMEWORK/Headers/sharedKit.h" 2>/dev/null || echo "Header file not found!"

      # ============================================
      # PHASE 3: IOS PROJECT SETUP
      # ============================================

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iosApp
          xcodegen generate
          echo "Xcode project generated"

      - name: Install Ruby Dependencies (Fastlane + CocoaPods)
        run: |
          cd iosApp
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          bundle exec fastlane --version
          echo "Fastlane and CocoaPods installed"

      - name: Validate ASC key format
        run: |
          cd iosApp
          ruby -e 'require "base64"; raw = ENV.fetch("ASC_PRIVATE_KEY", "").strip; abort("ASC_PRIVATE_KEY is missing") if raw.empty?; pem = (raw.include?("BEGIN PRIVATE KEY") || raw.include?("BEGIN EC PRIVATE KEY")) ? raw : Base64.decode64(raw); pem = pem.gsub("\\n", "\n").gsub("\r\n", "\n").strip; abort("ASC key is not PEM") unless pem.include?("BEGIN") && pem.include?("END"); puts "ASC key payload looks valid"'

      - name: Install Pod Dependencies
        run: |
          cd iosApp
          bundle exec pod install --repo-update
          echo "Pods installed"

      # ============================================
      # PHASE 4: BUILD, SIGN & UPLOAD (Fastlane)
      # ============================================

      - name: Setup Keychain
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Debug Fastlane Detection
        run: |
          pwd
          find . -name Fastfile

      - name: Print Fastfile
        run: |
          cat iosApp/fastlane/Fastfile

      - name: Run Fastlane Beta (Match + Build + Upload)
        run: |
          cd iosApp
          pwd
          ls -la
          ls -la fastlane
          bundle exec fastlane beta
          echo "TestFlight deployment complete!"

      # ============================================
      # PHASE 5: ARTIFACTS & CLEANUP
      # ============================================

      - name: Print Build Errors on Failure
        if: failure()
        run: |
          echo "=== BUILD ERRORS ==="
          grep -i "error:" ~/Library/Logs/gym/iosApp-iosApp.log | head -50 || true
          echo ""
          echo "=== LINKER ERRORS ==="
          grep -i "undefined\|ld:\|linker" ~/Library/Logs/gym/iosApp-iosApp.log | head -30 || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ~/Library/Logs/gym/*.log
          retention-days: 7

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ovasta-sellers-ios
          path: iosApp/build/*.ipa
          retention-days: 30

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Deployment Summary
        if: success()
        run: |
          echo "==================================="
          echo " TESTFLIGHT DEPLOYMENT SUCCESSFUL  "
          echo "==================================="
          echo ""
          echo "App: Ovasta Sellers"
          echo "Bundle ID: com.ovasta.sellers"
          echo "Team ID: H8X427WWQW"
          echo ""
          echo "Next Steps:"
          echo "  1. Go to appstoreconnect.apple.com"
          echo "  2. Wait for processing (15-30 min)"
          echo "  3. Add beta testers when ready"