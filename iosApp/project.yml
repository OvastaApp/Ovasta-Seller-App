name: iosApp
options:
  bundleIdPrefix: com.ovasta
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "26.0"

settings:
  DEVELOPMENT_TEAM: H8X427WWQW

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ovasta.sellers
      INFOPLIST_FILE: iosApp/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "1.0.3"
      CURRENT_PROJECT_VERSION: 8
      VERSIONING_SYSTEM: "apple-generic"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.ovasta.sellers"
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "sharedKit"
      ENABLE_USER_SCRIPT_SANDBOXING: false
    preBuildScripts:
      - script: |
          set -e
          cd "$SRCROOT/.."

          # Skip rebuilding on CI - framework is already built by the workflow
          if [ "$CI" = "true" ]; then
            echo "CI detected - skipping Gradle build (framework already built by workflow)"
            ARCH="IosArm64"
            CONFIG_LOWER="release"
            FRAMEWORK_PATH="$SRCROOT/../shared/build/bin/iosArm64/${CONFIG_LOWER}Framework/sharedKit.framework"
            if [ -d "$FRAMEWORK_PATH" ]; then
              echo "Framework found at: $FRAMEWORK_PATH"
              exit 0
            else
              echo "ERROR: Framework not found at: $FRAMEWORK_PATH (CI should have built it)"
              exit 1
            fi
          fi

          # Determine architecture based on SDK
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              ARCH="IosSimulatorArm64"
            else
              ARCH="IosX64"
            fi
          else
            ARCH="IosArm64"
          fi

          # Determine configuration
          if [ "$CONFIGURATION" = "Debug" ]; then
            CONFIG="Debug"
            CONFIG_LOWER="debug"
          else
            CONFIG="Release"
            CONFIG_LOWER="release"
          fi

          # Set JAVA_HOME if not already set
          if [ -z "$JAVA_HOME" ]; then
            if [ -d "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" ]; then
              export JAVA_HOME="/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
            elif [ -x "/usr/libexec/java_home" ]; then
              export JAVA_HOME=$(/usr/libexec/java_home 2>/dev/null || true)
            fi
            export PATH="$JAVA_HOME/bin:$PATH"
          fi

          # Build the framework using Gradle
          TASK="link${CONFIG}Framework${ARCH}"
          echo "Building sharedKit framework: $TASK"
          ./gradlew :shared:$TASK --no-daemon

          # Verify framework was built
          FRAMEWORK_PATH="$SRCROOT/../shared/build/bin/$(echo $ARCH | sed 's/^Ios/ios/')/${CONFIG_LOWER}Framework/sharedKit.framework"
          if [ ! -d "$FRAMEWORK_PATH" ]; then
            echo "ERROR: Framework not found at: $FRAMEWORK_PATH"
            exit 1
          fi

          echo "Framework built successfully at: $FRAMEWORK_PATH"
        name: "Build Kotlin Multiplatform Framework"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: |
          set -e

          # Determine architecture and configuration
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            if [ "$(uname -m)" = "arm64" ]; then
              ARCH="iosSimulatorArm64"
            else
              ARCH="iosX64"
            fi
          else
            ARCH="iosArm64"
          fi

          if [ "$CONFIGURATION" = "Debug" ]; then
            CONFIG="debug"
          else
            CONFIG="release"
          fi

          # Source and destination paths
          FRAMEWORK_PATH="$SRCROOT/../shared/build/bin/$ARCH/${CONFIG}Framework/sharedKit.framework"
          FRAMEWORKS_DIR="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"

          echo "Embedding sharedKit framework from: $FRAMEWORK_PATH"

          mkdir -p "$FRAMEWORKS_DIR"

          if [ -d "$FRAMEWORKS_DIR/sharedKit.framework" ]; then
            rm -rf "$FRAMEWORKS_DIR/sharedKit.framework"
          fi

          if [ -d "$FRAMEWORK_PATH" ]; then
            cp -R "$FRAMEWORK_PATH" "$FRAMEWORKS_DIR/"
            echo "Framework embedded successfully"
          else
            echo "ERROR: Framework not found at: $FRAMEWORK_PATH"
            exit 1
          fi

          # Copy Compose resources to app bundle
          COMPOSE_RESOURCES_DIR="$SRCROOT/../shared/build/generated/compose/resourceGenerator/preparedResources/commonMain/composeResources"
          APP_RESOURCES_DIR="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources/composeResources/com.ovasta.sellers.shared.resources"
          
          if [ -d "$COMPOSE_RESOURCES_DIR" ]; then
            echo "Copying Compose resources to app bundle..."
            mkdir -p "$APP_RESOURCES_DIR"
            cp -R "$COMPOSE_RESOURCES_DIR/" "$APP_RESOURCES_DIR/"
            echo "Compose resources copied successfully"
          else
            echo "WARNING: Compose resources not found at: $COMPOSE_RESOURCES_DIR"
          fi
        name: "Embed Kotlin Framework"
        basedOnDependencyAnalysis: false
