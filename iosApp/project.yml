name: iosApp
options:
  bundleIdPrefix: com.ovasta
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.2"

settings:
  DEVELOPMENT_TEAM: H8X427WWQW

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ovasta.sellers
      INFOPLIST_FILE: iosApp/Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 1
      VERSIONING_SYSTEM: "apple-generic"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
      PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.ovasta.sellers"
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-framework"
        - "sharedKit"
      ENABLE_USER_SCRIPT_SANDBOXING: false
    dependencies: []
    preBuildScripts: []
